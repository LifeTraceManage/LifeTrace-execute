name: lifetrace_execute
description: Production Flutter client for LifeTrace Execute.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  dio: ^5.8.0+1
  drift: ^2.26.1
  file_picker: ^12.2.0
  flutter_riverpod: ^2.6.1
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  flutter_secure_storage: ^10.3.2
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  mime: ^2.1.0
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.32
  timezone: ^0.11.1
  uuid: ^4.5.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.1

flutter:
  uses-material-design: true
