name: Flutter Preview CI

on:
  push:
    branches:
      - feature/flutter-high-fidelity-preview
    paths:
      - "flutter-preview/**"
      - ".github/workflows/flutter-preview-ci.yml"
  pull_request:
    paths:
      - "flutter-preview/**"
      - ".github/workflows/flutter-preview-ci.yml"

jobs:
  flutter-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-preview
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
