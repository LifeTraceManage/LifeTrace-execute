name: Legacy Compose Android CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build legacy Compose debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run legacy Compose unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run legacy Compose lint
        run: gradle :app:lintDebug --stacktrace
