name: Flutter Production CI

on:
  push:
    branches:
      - refactor/flutter-production
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-production-ci.yml"
      - "docs/development/FLUTTER_REFACTOR_PLAN.md"
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-production-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android and Web platform files
        run: flutter create . --platforms=android,web --org com.lifetrace --project-name lifetrace_execute

      - name: Preserve production Android applicationId
        run: |
          python - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('com.lifetrace.lifetrace_execute', 'com.lifetrace.execute')
          gradle.write_text(text)

          old = Path('android/app/src/main/kotlin/com/lifetrace/lifetrace_execute/MainActivity.kt')
          new = Path('android/app/src/main/kotlin/com/lifetrace/execute/MainActivity.kt')
          if old.exists():
              new.parent.mkdir(parents=True, exist_ok=True)
              new.write_text(old.read_text().replace('package com.lifetrace.lifetrace_execute', 'package com.lifetrace.execute'))
              old.unlink()
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Web preview
        run: flutter build web --release --target lib/web_preview_main.dart --base-href "/LifeTrace-execute/"
