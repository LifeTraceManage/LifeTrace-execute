name: Flutter Production CI

on:
  push:
    branches:
      - refactor/flutter-production
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-production-ci.yml"
      - "docs/development/FLUTTER_REFACTOR_PLAN.md"
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-production-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android and Web platform files
        run: flutter create . --platforms=android,web --org com.lifetrace --project-name lifetrace_execute --no-pub

      - name: Preserve production Android configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('com.lifetrace.lifetrace_execute', 'com.lifetrace.execute')
          text = text.replace(
              'sourceCompatibility = JavaVersion.VERSION_11',
              'sourceCompatibility = JavaVersion.VERSION_17',
          )
          text = text.replace(
              'targetCompatibility = JavaVersion.VERSION_11',
              'targetCompatibility = JavaVersion.VERSION_17',
          )
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in text:
              text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(text)

          old = Path('android/app/src/main/kotlin/com/lifetrace/lifetrace_execute/MainActivity.kt')
          new = Path('android/app/src/main/kotlin/com/lifetrace/execute/MainActivity.kt')
          if old.exists():
              new.parent.mkdir(parents=True, exist_ok=True)
              new.write_text(old.read_text().replace('package com.lifetrace.lifetrace_execute', 'package com.lifetrace.execute'))
              old.unlink()

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'android.permission.RECEIVE_BOOT_COMPLETED' not in xml:
              xml = xml.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>',
                  1,
              )
          receivers = '''
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in xml:
              xml = xml.replace('</application>', receivers + '\n    </application>', 1)
          manifest.write_text(xml)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Web preview
        run: flutter build web --release --target lib/web_preview_main.dart --base-href "/LifeTrace-execute/"
