name: Flutter Production CI

on:
  push:
    branches:
      - main
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-production-ci.yml"
      - ".github/workflows/publish-release-apk.yml"
      - "docs/development/FLUTTER_REFACTOR_PLAN.md"
  pull_request:
    branches:
      - main
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-production-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Verify committed Android platform
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -x android/gradlew
          grep -q 'applicationId = "com.lifetrace.execute"' android/app/build.gradle.kts
          grep -q 'namespace = "com.lifetrace.execute"' android/app/build.gradle.kts
          grep -q 'package com.lifetrace.execute' android/app/src/main/kotlin/com/lifetrace/execute/MainActivity.kt
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Bootstrap Web platform files
        run: flutter create . --platforms=web --project-name lifetrace_execute --no-pub

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Web preview
        run: flutter build web --release --target lib/web_preview_main.dart --base-href "/LifeTrace-execute/"
