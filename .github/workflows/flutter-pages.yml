name: Deploy Flutter Preview to GitHub Pages

on:
  workflow_run:
    workflows:
      - Flutter Production CI
    types:
      - completed
    branches:
      - refactor/flutter-production
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout Flutter production branch
        uses: actions/checkout@v4
        with:
          ref: refactor/flutter-production

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Flutter Web platform
        run: flutter create . --platforms=web --project-name lifetrace_execute

      - name: Get dependencies
        run: flutter pub get

      - name: Build production Flutter Web preview
        run: flutter build web --release --target lib/web_preview_main.dart --base-href "/LifeTrace-execute/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
