name: Unified Mobile Migration CI

on:
  push:
    branches:
      - refactor/unified-mobile-shell
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platform files
        run: flutter create . --platforms=android,web --org com.lifetrace --project-name lifetrace_execute --no-pub
      - name: Preserve production Android configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('sourceCompatibility = JavaVersion.VERSION_11', 'sourceCompatibility = JavaVersion.VERSION_17')
          text = text.replace('targetCompatibility = JavaVersion.VERSION_11', 'targetCompatibility = JavaVersion.VERSION_17')
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in text:
              text += '\\n\\ndependencies {\\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\\n}\\n'
          gradle.write_text(text)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Analyze
        continue-on-error: true
        run: |
          flutter analyze 2>&1 | tee analyze.log
          echo '## Flutter analyze' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat analyze.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        continue-on-error: true
        run: |
          flutter test 2>&1 | tee test.log
          echo '## Flutter test' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Build Web preview
        run: flutter build web --release --target lib/web_preview_main.dart --base-href "/LifeTrace-execute/"
      - name: Analyze gate
        run: grep -q "No issues found" analyze.log
      - name: Test gate
        run: grep -q "All tests passed" test.log
